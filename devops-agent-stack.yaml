                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:Connect-HighConcurrentEmailsPercent",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:Connect-ContactLens-HighConcurrentRealTimeAnalytics",
