  # ============================================================
  # Vended Log Delivery (CloudWatch Logs)
  # ============================================================

  DevOpsAgentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/aidevops/${AWS::StackName}/agent-space-logs
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: DevOpsAgent
        - Key: Environment
          Value: !Ref EnvironmentTag

  DevOpsAgentLogDeliverySource:
    Type: AWS::Logs::DeliverySource
    DependsOn: AgentSpace
    Properties:
      Name: devops-agent-space-source
      ResourceArn: !GetAtt AgentSpace.Arn
      LogType: APPLICATION_LOGS

  DevOpsAgentLogDeliveryDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: devops-agent-space-destination
      DeliveryDestinationType: CWL
      DestinationResourceArn: !GetAtt DevOpsAgentLogGroup.Arn
      OutputFormat: json

  DevOpsAgentLogDelivery:
    Type: AWS::Logs::Delivery
    DependsOn:
      - DevOpsAgentLogDeliverySource
      - DevOpsAgentLogDeliveryDestination
    Properties:
      DeliverySourceName: devops-agent-space-source
      DeliveryDestinationArn: !GetAtt DevOpsAgentLogDeliveryDestination.Arn

# ============================================================
# Outputs
# ============================================================

Outputs:
  AgentSpaceId:
    Description: The agent space ID
    Value: !GetAtt AgentSpace.AgentSpaceId
  AgentSpaceArn:
    Description: The agent space ARN
    Value: !GetAtt AgentSpace.Arn
  AgentSpaceRoleArn:
    Description: The agent space IAM role ARN
    Value: !GetAtt DevOpsAgentSpaceRole.Arn
  OperatorRoleArn:
    Description: The operator app IAM role ARN
    Value: !GetAtt DevOpsOperatorRole.Arn
  AlarmTopicArn:
    Description: SNS topic ARN for alarm notifications
    Value: !Ref DevOpsAgentAlarmTopic
  DashboardURL:
    Description: Direct link to the CloudWatch dashboard
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=DevOpsAgent-Observability-${AWS::StackName}
  LogGroupName:
    Description: CloudWatch Log Group for vended logs
    Value: !Ref DevOpsAgentLogGroup
  ConnectInstanceMonitored:
    Description: Amazon Connect instance ID being monitored
    Value: !Ref ConnectInstanceId
  AlarmForwarderDLQUrl:
    Description: Dead letter queue URL for failed webhook deliveries
    Value: !Ref AlarmForwarderDLQ
  AlarmForwarderDLQArn:
    Description: Dead letter queue ARN for monitoring
    Value: !GetAtt AlarmForwarderDLQ.Arn
